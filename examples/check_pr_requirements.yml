name: Check PR Requirements

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main, master]

# Least privilege: contents for checkout-free composite, pull-requests for
# the release notes presence check (reads PR data via the API). Use
# pull-requests: write if comment-on-failure is enabled.
permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr:
    name: PR Requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check PR requirements
        uses: AbsaOSS/check-pr-requirements@v0
        with:
          # PR data (title, body, branch, author, labels, size) and github-token
          # default to the pull_request event; pass them only to override.

          # Enable/disable checks
          check-title: "true"
          check-description: "true"
          check-issue-reference: "true"
          check-release-notes: "true"
          check-branch-name: "true"
          check-pr-size: "true"
          check-label: "false"
          check-target-branch: "true"

          # Configuration
          title-types: "feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert"
          description-min-length: "20"
          max-files-changed: "50"
          branch-pattern: "^(feature|bugfix|hotfix|release|support|chore|docs|ci|dependabot)/[a-zA-Z0-9._/-]+$"
          allowed-target-branches: "main,master"
          # Bypass all checks for bot authors (comma-separated logins). Empty = no bypass.
          skip-actors: "dependabot[bot]"
          # Bypass all checks when the PR carries any of these labels. Empty = no bypass.
          skip-labels: "skip-checks"
          release-notes-tag: "## [Rr]elease [Nn]otes"
          release-notes-skip-labels: "no RN"
          # Report these checks as non-blocking warnings instead of failures
          warn-checks: "pr-size"
          # Also cap changed lines (additions + deletions); empty = no limit
          max-lines-changed: ""
          # Post the summary as a PR comment while checks fail (needs pull-requests: write)
          comment-on-failure: "false"
