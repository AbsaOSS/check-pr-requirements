name: Test

on:
  push:
    branches: [main, master]
  # Every PR, including stacked PRs that target another PR's branch
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unit tests
        run: bash tests/run_tests.sh

  integration-test-pass:
    name: Integration - All Pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action (should pass)
        uses: ./
        with:
          pr-title: "feat(auth): add OAuth2 login"
          pr-body: "This PR adds OAuth2 login support. Fixes #42"
          pr-branch: "feature/oauth2-login"
          target-branch: "main"
          files-changed: "5"
          labels: "enhancement"
          check-title: "true"
          check-description: "true"
          check-issue-reference: "true"
          check-branch-name: "true"
          check-pr-size: "true"
          check-label: "true"
          check-target-branch: "true"
          check-release-notes: "false"

  integration-test-title-fail:
    name: Integration - Title Fail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action (should fail)
        id: check
        uses: ./
        continue-on-error: true
        with:
          pr-title: "Update login page"
          pr-body: "This PR updates the login page. See #10"
          check-title: "true"
          check-description: "true"
          check-issue-reference: "true"
          check-release-notes: "false"

      - name: Verify failure
        if: steps.check.outcome != 'failure'
        run: |
          echo "Expected action to fail but it passed"
          exit 1

  integration-test-minimal:
    name: Integration - Minimal Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run with only title check
        uses: ./
        with:
          pr-title: "fix: resolve crash on startup"
          check-title: "true"
          check-description: "false"
          check-issue-reference: "false"
          check-release-notes: "false"

  integration-test-all-disabled:
    name: Integration - All Disabled
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run with all checks disabled
        uses: ./
        with:
          pr-title: "anything goes"
          check-title: "false"
          check-description: "false"
          check-issue-reference: "false"
          check-release-notes: "false"

  integration-test-absa-profile:
    name: Integration - ABSA Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run with ABSA-aligned configuration (should pass)
        uses: ./
        with:
          pr-title: "#123: Add user login"
          pr-body: |
            ## Overview
            Adds the login flow.

            ## Release Notes
            - Added the ability to log in.

            ## Related
            Closes AB#12345
          pr-branch: "feature/123-user-login"
          target-branch: "support/1.0.4"
          check-title: "true"
          title-formats: "issue-number"
          check-description: "true"
          description-required-sections: "## Overview,## Release Notes,## Related"
          check-issue-reference: "true"
          issue-reference-require-keyword: "true"
          check-branch-name: "true"
          branch-require-ticket: "true"
          check-target-branch: "true"
          allowed-target-branches: "main,master,support/*,release/*"
          check-release-notes: "false"

  integration-test-bypass:
    name: Integration - Bypass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run with bot author in skip-actors (should pass despite invalid title)
        id: check
        uses: ./
        with:
          pr-title: "Bump actions/checkout from 6 to 7"
          pr-author: "dependabot[bot]"
          skip-actors: "dependabot[bot]"
          check-release-notes: "true"

      - name: Verify bypass outputs
        env:
          SKIPPED: ${{ steps.check.outputs.skipped }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          if [[ "$SKIPPED" != "true" || "$RESULT" != "pass" ]]; then
            echo "Expected skipped=true and result=pass, got skipped=$SKIPPED result=$RESULT"
            exit 1
          fi

  integration-test-event-defaults:
    name: Integration - Event Defaults
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run without PR data inputs (read from the event)
        id: check
        uses: ./
        continue-on-error: true
        with:
          check-title: "false"
          check-description: "false"
          check-issue-reference: "false"
          check-target-branch: "true"
          allowed-target-branches: "*"
          check-pr-size: "true"
          max-files-changed: "0"

      - name: Verify target branch passed and PR size failed on real data
        env:
          PASS_COUNT: ${{ steps.check.outputs.pass-count }}
          FAIL_COUNT: ${{ steps.check.outputs.fail-count }}
        run: |
          if [[ "$PASS_COUNT" != "1" || "$FAIL_COUNT" != "1" ]]; then
            echo "Expected 1 pass (target-branch) and 1 fail (pr-size), got pass=$PASS_COUNT fail=$FAIL_COUNT"
            exit 1
          fi
