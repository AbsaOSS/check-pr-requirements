name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release-notes:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - name: Generate release notes
        id: release_notes
        uses: AbsaOSS/generate-release-notes@4592187ca123598c8f0bd6de06311c9f5cd8b773 # v1.3.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-name: ${{ github.ref_name }}
          chapters: |
            - {"title": "Breaking Changes 💥", "label": "breaking-change"}
            - {"title": "New Features 🎉", "labels": "feature, enhancement"}
            - {"title": "Bugfixes 🛠", "labels": "bug, bugfix"}
            - {"title": "Documentation 📚", "label": "documentation"}
            - {"title": "Infrastructure ⚙️", "labels": "infrastructure, github_actions"}
            - {"title": "Refactoring ♻️", "label": "refactoring"}
            - {"title": "Dependency Updates 📦", "label": "dependencies"}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.release_notes.outputs.release-notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES"
          fi
