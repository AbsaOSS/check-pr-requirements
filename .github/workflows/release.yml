name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-major-tag:
    name: Move major version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Point the major tag (e.g. v0) at this release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not vX.Y.Z; leaving the major tag unchanged"
            exit 0
          fi
          major_tag="${RELEASE_TAG%%.*}"
          git tag -f "$major_tag" "$RELEASE_TAG"
          git push -f origin "refs/tags/$major_tag"
